<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - {{ store_settings.store_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background: #f8fafc; }
        .sidebar { min-height: 100vh; background: #1e293b; color: white; }
        .sidebar a { color: #94a3b8; text-decoration: none; padding: 10px 20px; display: block; }
        .sidebar a:hover, .sidebar a.active { color: white; background: #334155; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse p-3">
                <h4 class="text-white mb-4 fw-bold"><i class="fa-solid fa-shield-halved me-2"></i>Admin Panel</h4>
                <ul class="nav flex-column">
                    <li class="nav-item mb-1"><a href="{% url 'admin_dashboard' %}"><i class="fa-solid fa-chart-line me-2"></i>Dashboard</a></li>
                    <li class="nav-item mb-1"><a href="{% url 'admin_products' %}"><i class="fa-solid fa-box me-2"></i>Products</a></li>
                    <li class="nav-item mb-1"><a href="{% url 'admin_categories' %}"><i class="fa-solid fa-tags me-2"></i>Categories</a></li>
                    <li class="nav-item mb-1"><a href="{% url 'admin_orders' %}"><i class="fa-solid fa-receipt me-2"></i>Orders</a></li>
                    <li class="nav-item mb-1"><a href="{% url 'admin_customers' %}"><i class="fa-solid fa-users me-2"></i>Customers</a></li>
                    <li class="nav-item mb-1"><a href="{% url 'admin_settings' %}"><i class="fa-solid fa-gear me-2"></i>Settings</a></li>
                    <li class="nav-item mt-4"><a href="{% url 'home' %}" class="text-warning"><i class="fa-solid fa-globe me-2"></i>View Public Store</a></li>
                </ul>
            </nav>
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
                {% block admin_content %}{% endblock %}
            </main>
        </div>
    </div>
</body>
</html>
