{% extends 'admin_panel/base_admin.html' %}
{% block admin_content %}
<div class="card border-0 shadow-sm p-4 mx-auto" style="max-width: 700px;">
    <h2 class="fw-bold mb-4">{{ title }}</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mt-3">Save Product</button>
    </form>
</div>
{% endblock %}
